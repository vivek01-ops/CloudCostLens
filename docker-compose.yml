name: cloudcostlens

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vivek512/cloudcostlens:1.0.0 
    container_name: cloudcostlens
    init: true
    ports:
      # Host port is configurable via PORT in .env; the app always listens on 5000 inside.
      - "${PORT:-5000}:5000"
    # Optional settings come from .env (DEMO_MODE, AWS_REGION, COST_DAYS, SECRET_KEY,
    # AWS_PROFILE, ...). If .env is absent, the app's built-in defaults are used
    # (DEMO_MODE=1, AWS_REGION=us-east-1, COST_DAYS=30).
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
    volumes:
      # Persist CLI installs and login caches across restarts.
      - aws-credentials:/home/appuser/.aws
      - azure-credentials:/home/appuser/.azure
      - cli-tools:/home/appuser/.local
      # Alternatively, reuse credentials already on the host (read-only):
      # - ${HOME}/.aws:/home/appuser/.aws:ro
      # - ${HOME}/.azure:/home/appuser/.azure:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aws-credentials:
  azure-credentials:
  cli-tools:
